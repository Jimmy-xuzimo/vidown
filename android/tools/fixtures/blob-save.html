<!doctype html>
<html lang="en">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Preparing controlled blob</title>
  <body style="margin: 0">
    <button id="save" style="width: 100%; height: 160px; font-size: 28px; border: 0; background: #9cc9df; color: #102d38" disabled>
      Preparing file
    </button>
    <script>
      // Headers and page load are not evidence that the asynchronous blob is ready.
      // Keep preparation slow enough to expose a premature click deterministically.
      Promise.all([
        fetch("/sample.mp4").then((r) => {
          if (!r.ok) throw new Error("Fixture media unavailable");
          return r.blob();
        }),
        new Promise((resolve) => setTimeout(resolve, 3000)),
      ]).then(([blob]) => {
        const button = document.getElementById("save");
        button.onclick = () => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "controlled.mp4";
          a.click();
          document.title = "Controlled blob save requested";
        };
        button.textContent = "Save controlled video";
        button.disabled = false;
        document.title = "Controlled blob ready";
      }).catch(() => { document.title = "Controlled blob preparation failed"; });
    </script>
  </body>
</html>
